<button class="assistant-launcher" id="assistant-launcher" type="button" aria-controls="assistant-panel" aria-expanded="false" title="Ask the UMSHADO Planning Assistant">
  <i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i><span>Ask UMSHADO</span>
</button>
<aside class="assistant-panel" id="assistant-panel" aria-labelledby="assistant-title" hidden>
  <header class="assistant-header">
    <div><span class="assistant-mark"><i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i></span><div><strong id="assistant-title">UMSHADO Assistant</strong><small>Wedding planning help</small></div></div>
    <button class="assistant-close" id="assistant-close" type="button" aria-label="Close planning assistant"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
  </header>
  <div class="assistant-messages" id="assistant-messages" aria-live="polite">
    <div class="assistant-message assistant-message-bot">Hello {{ current_user.name.split()[0] }}. I can explain UMSHADO, summarise your wedding budget, and prepare budget or quotation changes for your confirmation.</div>
  </div>
  <div class="assistant-suggestions" id="assistant-suggestions">
    <button type="button" data-assistant-prompt="Summarise my wedding budget.">Summarise my budget</button>
    <button type="button" data-assistant-prompt="Which budget items do not have quotations yet?">Missing quotations</button>
    <button type="button" data-assistant-prompt="Explain how I invite a stakeholder.">Inviting stakeholders</button>
  </div>
  <form class="assistant-form" id="assistant-form" data-no-loader data-message-url="{{ url_for('assistant.message') }}" data-confirm-url="{{ url_for('assistant.confirm') }}" data-csrf-token="{{ csrf_token() }}">
    <label class="sr-only" for="assistant-input">Message the UMSHADO Planning Assistant</label>
    <textarea id="assistant-input" maxlength="1200" rows="2" placeholder="Ask about your wedding project…" required></textarea>
    <button type="submit" aria-label="Send message"><i class="fa-solid fa-paper-plane" aria-hidden="true"></i></button>
  </form>
  <footer class="assistant-footer"><span>AI can make mistakes. Check important figures.</span><button id="assistant-clear" type="button">Clear chat</button></footer>
</aside>
